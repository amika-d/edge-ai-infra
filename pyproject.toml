[project]
name = "edge-computing"
version = "0.1.0"
description = "Private LLM inference + document RAG gateway"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    # API
    "fastapi>=0.129.0",
    "uvicorn>=0.40.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    # HTTP clients
    "aiohttp>=3.13.3",
    "httpx>=0.28.0",
    # Observability
    "prometheus-client>=0.24.1",
    # Vector store
    "qdrant-client>=1.17.0",
    # Embeddings (query time — runs inside gateway)
    "sentence-transformers>=5.2.3",
    "fastembed>=0.7.4",
    "transformers>=4.57.6",
    "tokenizers>=0.22.2",
    # PDF parsing + chunking (ingest CLI)
    "docling>=2.74.0",
    "docling-core[chunking-openai]>=2.65.1",
    # Tests
    "pytest>=9.0.2",
    "pandas>=2.3.3",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    # Notebooks / eval
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "pandas>=2.3.3",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gateway*"]
